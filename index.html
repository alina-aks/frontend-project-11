<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>RSS Aggregator</title>
  </head>
  <body>
    <main class="w-4/5 max-w-4xl mx-auto mt-12 bg-gray-200 rounded-xl p-8">

    <h1 class="text-4xl font-semibold mb-3">RSS агрегатор</h1>
    <p class="text-xl mb-6 text-gray-800">Начните читать RSS сегодня! Это легко, это красиво.</p>
    <form id="rss-form" class="flex gap-3">
      <input type="url" name="url" id="url-input" placeholder="Ссылка RSS" class="flex-1 rounded-lg">
      <button type="submit" class="bg-gray-600 text-white px-6 py-3 rounded-lg">Добавить</button>
    </form>
    <p class="text-sm text-gray-400 mt-4 ">Пример: https://lorem-rss.hexlet.app/feed</p>

    </main>


    <script type="module" src="/src/main.js"></script>
  </body>
</html>
